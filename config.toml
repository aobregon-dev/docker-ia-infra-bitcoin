# Configuracion de nostr-rs-relay
# Se monta dentro del contenedor en /usr/src/app/config.toml

[info]
# URL con la que el relay se anuncia ante los clientes.
relay_url = "ws://localhost:8080/"

# Nombre del relay.
name = "nostr-rs-relay-aobregon-dev"

# Descripcion que muestra el cliente en Relays -> Info.
# Es la evidencia de la practica: debe coincidir exactamente.
description = "Relay local de practica para Docker - aobregon-dev"

[network]
# Escuchar en todas las interfaces del contenedor.
address = "0.0.0.0"

# Puerto interno del relay.
port = 8080
